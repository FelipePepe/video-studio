server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Compress text assets only; /api responses are proxied and never gzipped here.
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API + Server-Sent Events. SSE (/api/jobs/:id/events and the approve
    # stream) must NOT be buffered, otherwise progress events arrive in bursts
    # or only when the response ends. Timeouts are long because renders are slow.
    #
    # `backend` is resolved through Docker's embedded DNS on every request (variable
    # in proxy_pass), not once at startup: recreating the backend container during a
    # redeploy gives it a new IP and nginx would otherwise keep proxying to the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build output can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry point must always be revalidated so new builds are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
